version: '3.8'

services:
  fraud-detection:
    build:
      context: .
      target: production
    container_name: fraud-detection-web
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - MCP_SERVER_HOST=localhost
      - MCP_SERVER_PORT_DATA=8001
      - MCP_SERVER_PORT_MODEL=8002
      - MCP_SERVER_PORT_DECISION=8003
      - MCP_SERVER_PORT_MONITORING=8004
      - FRAUD_THRESHOLD=0.7
      - MODEL_UPDATE_INTERVAL=3600
      - VECTOR_DB_SIZE=10000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s