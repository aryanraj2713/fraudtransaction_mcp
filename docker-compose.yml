version: '3.8'

services:
  # Main Fraud Detection System
  fraud-detection-system:
    build:
      context: .
      target: production
    container_name: fraud-detection-main
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT_DATA=8001
      - MCP_SERVER_PORT_MODEL=8002
      - MCP_SERVER_PORT_DECISION=8003
      - MCP_SERVER_PORT_MONITORING=8004
      - FRAUD_THRESHOLD=0.7
      - MODEL_UPDATE_INTERVAL=3600
      - VECTOR_DB_SIZE=10000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - fraud-detection-network
    depends_on:
      - redis
      - vector-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Data Intelligence MCP Server
  data-intelligence-server:
    build:
      context: .
      target: production
    container_name: fraud-detection-data-server
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
    ports:
      - "8001:8001"
    networks:
      - fraud-detection-network
    command: ["python", "-m", "src.servers.data_intelligence_server"]
    restart: unless-stopped

  # Model Orchestration MCP Server
  model-orchestration-server:
    build:
      context: .
      target: production
    container_name: fraud-detection-model-server
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8002
    ports:
      - "8002:8002"
    volumes:
      - ./models:/app/models
    networks:
      - fraud-detection-network
    command: ["python", "-m", "src.servers.model_orchestration_server"]
    restart: unless-stopped

  # Decision Engine MCP Server
  decision-engine-server:
    build:
      context: .
      target: production
    container_name: fraud-detection-decision-server
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8003
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8003:8003"
    networks:
      - fraud-detection-network
    command: ["python", "-m", "src.servers.decision_engine_server"]
    restart: unless-stopped

  # Monitoring & Response MCP Server
  monitoring-server:
    build:
      context: .
      target: production
    container_name: fraud-detection-monitoring-server
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8004
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    ports:
      - "8004:8004"
    volumes:
      - ./logs:/app/logs
    networks:
      - fraud-detection-network
    command: ["python", "-m", "src.servers.monitoring_server"]
    restart: unless-stopped

  # Redis for caching and inter-service communication
  redis:
    image: redis:7-alpine
    container_name: fraud-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fraud-detection-network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # In-memory Vector Database (ChromaDB)
  vector-db:
    image: chromadb/chroma:latest
    container_name: fraud-detection-vector-db
    ports:
      - "8100:8000"
    volumes:
      - vector-data:/chroma/chroma
    networks:
      - fraud-detection-network
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-detection-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - fraud-detection-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fraud-detection-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - fraud-detection-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

  # Load balancer (nginx)
  load-balancer:
    image: nginx:alpine
    container_name: fraud-detection-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - fraud-detection-network
    depends_on:
      - fraud-detection-system
    restart: unless-stopped

  # Demo runner service
  demo-runner:
    build:
      context: .
      target: production
    container_name: fraud-detection-demo
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEMO_MODE=continuous
      - DEMO_DURATION=3600  # 1 hour
    networks:
      - fraud-detection-network
    depends_on:
      - fraud-detection-system
    command: ["python", "demo.py", "--demo", "performance"]
    restart: "no"

volumes:
  redis-data:
  vector-data:
  prometheus-data:
  grafana-data:

networks:
  fraud-detection-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16