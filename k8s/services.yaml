apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-system-service
  namespace: fraud-detection
  labels:
    app: fraud-detection-system
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: fraud-detection-system

---
apiVersion: v1
kind: Service
metadata:
  name: data-intelligence-service
  namespace: fraud-detection
  labels:
    app: data-intelligence-server
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: mcp
  selector:
    app: data-intelligence-server

