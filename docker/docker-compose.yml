version: '3.8'

services:
  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: fraud-detection-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # PostgreSQL for persistent data storage
  postgres:
    image: postgres:15-alpine
    container_name: fraud-detection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password_secure_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # Data Intelligence MCP Server
  data-intelligence-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fraud-detection-data-intelligence
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - MCP_SERVER_TYPE=data_intelligence
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://fraud_user:fraud_password_secure_123@postgres:5432/fraud_detection
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "mcp_servers.data_intelligence_server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # Model Orchestration MCP Server
  model-orchestration-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fraud-detection-model-orchestration
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - MCP_SERVER_TYPE=model_orchestration
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8002
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://fraud_user:fraud_password_secure_123@postgres:5432/fraud_detection
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "mcp_servers.model_orchestration_server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # Decision Engine MCP Server
  decision-engine-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fraud-detection-decision-engine
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - MCP_SERVER_TYPE=decision_engine
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8003
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://fraud_user:fraud_password_secure_123@postgres:5432/fraud_detection
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "mcp_servers.decision_engine_server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # Monitoring MCP Server
  monitoring-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fraud-detection-monitoring
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - MCP_SERVER_TYPE=monitoring
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8004
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://fraud_user:fraud_password_secure_123@postgres:5432/fraud_detection
    ports:
      - "8004:8004"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "mcp_servers.monitoring_server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # Main Fraud Detection System
  fraud-detection-system:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fraud-detection-main
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://fraud_user:fraud_password_secure_123@postgres:5432/fraud_detection
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_DATA_INTELLIGENCE_URL=http://data-intelligence-server:8001
      - MCP_MODEL_ORCHESTRATION_URL=http://model-orchestration-server:8002
      - MCP_DECISION_ENGINE_URL=http://decision-engine-server:8003
      - MCP_MONITORING_URL=http://monitoring-server:8004
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    depends_on:
      data-intelligence-server:
        condition: service_healthy
      model-orchestration-server:
        condition: service_healthy
      decision-engine-server:
        condition: service_healthy
      monitoring-server:
        condition: service_healthy
    command: ["python", "-m", "fraud_detection_system"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-detection-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - fraud-detection-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fraud-detection-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - fraud-detection-network

  # nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: fraud-detection-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - fraud-detection-system
    networks:
      - fraud-detection-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  fraud-detection-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16