events {
    worker_connections 1024;
}

http {
    upstream fraud_detection_backend {
        least_conn;
        server fraud-detection-system:8000;
    }

    upstream data_intelligence_backend {
        least_conn;
        server data-intelligence-server:8001;
    }

    upstream model_orchestration_backend {
        least_conn;
        server model-orchestration-server:8002;
    }

    upstream decision_engine_backend {
        least_conn;
        server decision-engine-server:8003;
    }

    upstream monitoring_backend {
        least_conn;
        server monitoring-server:8004;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Main fraud detection API
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Main API endpoints
        location /api/ {
            proxy_pass http://fraud_detection_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://fraud_detection_backend/health;
            access_log off;
        }

        # MCP Server endpoints (for external access)
        location /mcp/data-intelligence/ {
            proxy_pass http://data_intelligence_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /mcp/model-orchestration/ {
            proxy_pass http://model_orchestration_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /mcp/decision-engine/ {
            proxy_pass http://decision_engine_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /mcp/monitoring/ {
            proxy_pass http://monitoring_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Grafana dashboard
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Prometheus metrics
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static files and default response
        location / {
            return 200 '{"status": "Fraud Detection System API", "version": "1.0.0", "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json;
        }
    }
}