version: '3.8'

services:
  # Interactive Fraud Detection Web Interface
  fraud-detection-web:
    build:
      context: .
      target: production
    container_name: fraud-detection-interactive
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - fraud-test-network
    command: ["python", "-m", "src.web_interface"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CLI Testing Interface
  fraud-detection-cli:
    build:
      context: .
      target: production
    container_name: fraud-detection-cli
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    volumes:
      - ./logs:/app/logs
      - ./test-data:/app/test-data
    networks:
      - fraud-test-network
    stdin_open: true
    tty: true
    command: ["python", "interactive_cli.py"]
    depends_on:
      - fraud-detection-web

  # Performance Testing Service
  fraud-detection-perf:
    build:
      context: .
      target: production
    container_name: fraud-detection-performance
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TEST_DURATION=300  # 5 minutes
      - TEST_TPS=50        # 50 transactions per second
    volumes:
      - ./logs:/app/logs
      - ./perf-results:/app/results
    networks:
      - fraud-test-network
    command: ["python", "performance_test.py"]
    profiles:
      - performance  # Only run when specifically requested

networks:
  fraud-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16